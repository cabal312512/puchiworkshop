/*
 * 轻量街机物理：凸多边形/圆碰撞、摩擦与角动量、弹性节点约束。

tools.innerHTML=BOOP.config.tools.map((t,i)=>`<button class="tool" style="--tone:${tones[i]};--ink:${inks[i]}" data-tool="${t.id}" aria-label="${labels[t.id]}" aria-pressed="${t.id==='hand'}">${icon(t.id)}</button>`).join('');
tools.addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(b)game.setTool(b.dataset.tool);});
game.notify=()=>{};
function update(){
 for(const b of tools.children)b.setAttribute('aria-pressed',String(game.tool===b.dataset.tool));
 const locked=game.motionEnabled&&['waiting','active'].includes(game.motionStatus);
 $('joystick').setAttribute('aria-disabled',String(locked));$('normal').disabled=$('zero').disabled=locked;$('gyro').setAttribute('aria-pressed',String(locked));
 const gravity=locked?game.sensorFilter:game.manualGravity||{x:0,y:850},radius=$('joystick').clientWidth/2-16;
 $('knob').style.transform=`translate(${gravity.x/1700*radius}px,${gravity.y/1700*radius}px)`;
 $('auto').setAttribute('aria-pressed',String(game.autoSpawn));$('slow').setAttribute('aria-pressed',String(game.slow));$('sound').setAttribute('aria-pressed',String(platform.profile.settings.sound));$('sound').innerHTML=icon(platform.profile.settings.sound?'sound':'mute');
}
game.onChange=update;update();window.addEventListener('resize',()=>requestAnimationFrame(update));
function close(){if(backdrop.hidden)return;backdrop.hidden=true;game.resume('dialog');previousFocus?.focus();}
function open(symbol,body,label){previousFocus=document.activeElement;game.pause('dialog');$('dialog-symbol').innerHTML=icon(symbol);dialog.setAttribute('aria-label',label);$('dialog-body').innerHTML=body;backdrop.hidden=false;dialog.focus();}
$('close').onclick=close;backdrop.onclick=e=>{if(e.target===backdrop)close();};
document.addEventListener('keydown',e=>{if(backdrop.hidden)return;if(e.key==='Escape'){e.preventDefault();close();}if(e.key==='Tab'){const items=[...dialog.querySelectorAll('button,input')].filter(x=>!x.disabled);const first=items[0],last=items.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){e.preventDefault();last.focus();}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===dialog)){e.preventDefault();first.focus();}}});
$('normal').onclick=()=>game.setManualGravity(0,850);$('zero').onclick=()=>game.setManualGravity(0,0);
let stickId=null;
function stick(e){if($('joystick').getAttribute('aria-disabled')==='true')return;const r=$('joystick').getBoundingClientRect(),radius=r.width/2-16;let x=(e.clientX-r.left-r.width/2)/radius,y=(e.clientY-r.top-r.height/2)/radius;const d=Math.hypot(x,y);if(d>1){x/=d;y/=d;}if(d<.09)x=y=0;game.setManualGravity(x*1700,y*1700);}
$('joystick').addEventListener('pointerdown',e=>{if($('joystick').getAttribute('aria-disabled')==='true')return;e.preventDefault();stickId=e.pointerId;e.currentTarget.setPointerCapture(e.pointerId);stick(e);});
$('joystick').addEventListener('pointermove',e=>{if(e.pointerId===stickId)stick(e);});
for(const type of ['pointerup','pointercancel','lostpointercapture'])$('joystick').addEventListener(type,()=>stickId=null);
$('joystick').onkeydown=e=>{if($('joystick').getAttribute('aria-disabled')==='true')return;const v=game.manualGravity,moves={ArrowLeft:[-100,0],ArrowRight:[100,0],ArrowUp:[0,-100],ArrowDown:[0,100]};if(moves[e.key]){e.preventDefault();let x=v.x+moves[e.key][0],y=v.y+moves[e.key][1],d=Math.hypot(x,y);if(d>1700){x*=1700/d;y*=1700/d;}game.setManualGravity(x,y);}else if(e.key==='Home'){e.preventDefault();game.setManualGravity(0,850);}else if(e.key==='Delete'){e.preventDefault();game.setManualGravity(0,0);}};
$('gyro').onclick=async()=>{await game.enableMotion(false);if(!['waiting','active'].includes(game.motionStatus))game.motionEnabled=false;update();};
const originalChange=game.onChange;game.onChange=()=>{if(['denied','unavailable','off'].includes(game.motionStatus))game.motionEnabled=false;originalChange();};
$('random').onclick=()=>{game.audio.init();game.randomSpawn();};$('auto').onclick=()=>{game.autoSpawn=!game.autoSpawn;game.waitingForInput=false;update();};$('clear').onclick=()=>{game.clear();game.autoSpawn=false;game.waitingForInput=false;update();};
$('sound').onclick=()=>{platform.profile.settings.sound=!platform.profile.settings.sound;game.audio.setEnabled(platform.profile.settings.sound);game.audio.init();update();};$('slow').onclick=()=>{game.slow=!game.slow;update();};
const materials=[['jelly','软糖','#ec9cca'],['clay','黏土','#baaae6'],['foam','海绵','#f3d992'],['candy','积木','#efb09d'],['glass','玻璃','#87d5e2'],['rubber','弹力球','#8bd6bb'],['wood','木块','#d6b194'],['superball','弹珠','#91bfe8'],['ice','冰晶','#a0e0ec']];
function sample(id,color){
 const shapes={jelly:'<path d="M7 27C5 11 16 6 26 10c11-1 15 11 12 20-2 8-10 10-19 7-6 1-10-3-12-10Z"/>',clay:'<path d="M8 28c-1-8 3-10 8-10 2-9 9-12 15-6 7 0 10 6 8 11 2 9-5 13-14 12-9 4-16 0-17-7Z"/>',foam:'<rect x="9" y="9" width="30" height="30" rx="9"/>',candy:'<rect x="5" y="20" width="19" height="18" rx="4"/><rect x="25" y="20" width="18" height="18" rx="4"/><rect x="15" y="7" width="19" height="16" rx="4"/>',glass:'<path d="m13 9 22 2 6 20-19 9L7 25Z"/>',rubber:'<circle cx="24" cy="24" r="16"/>',wood:'<rect x="8" y="10" width="32" height="28" rx="5"/>',superball:'<circle cx="24" cy="24" r="14"/>',ice:'<path d="m13 8 20 0 11 17-12 16-20-3-9-17Z"/>'};
 const detail={jelly:'<ellipse cx="17" cy="17" rx="7" ry="3" transform="rotate(-25 17 17)" fill="#fff9"/><circle cx="31" cy="30" r="2" fill="#fff7"/>',clay:'<path d="M14 27q12-5 21-2M16 31q9-4 16-3"/>',foam:'<g fill="#ad8d5633" stroke="none"><circle cx="16" cy="17" r="2"/><circle cx="29" cy="17" r="2.5"/><circle cx="21" cy="29" r="2"/><circle cx="33" cy="29" r="2"/></g>',candy:'<path d="M11 25h7m13 0h6M20 12h8"/>',glass:'<path d="m14 12 9 4 12-2M23 16l-2 22m3-21 13 13"/>',rubber:'<path d="M13 26a11 11 0 0 1 10-13M34 25a10 10 0 0 1-9 10"/>',wood:'<path d="M12 17q10 4 24 0M12 23q13-4 24 0M12 31q11-4 24-1"/>',superball:'<ellipse cx="24" cy="24" rx="13" ry="5" transform="rotate(-28 24 24)"/><path d="M16 15q2-3 5-3"/>',ice:'<path d="m14 10 7 13 12-12M21 23l12 15m-12-15-8 13M21 23l20 2"/>'};
 return `<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><defs><linearGradient id="mat-${id}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".35" stop-color="${color}"/><stop offset="1" stop-color="${color}" stop-opacity=".6"/></linearGradient></defs><g fill="url(#mat-${id})" stroke="${color}" stroke-width="1.2">${shapes[id]}</g><g stroke="#ffffffa8" stroke-width="1.4" stroke-linecap="round" fill="none">${detail[id]}</g></svg>`;
}
let selection={material:'jelly',shape:'circle',size:90,count:3};
$('add').onclick=()=>{
 open('plus',`<div class="materials">${materials.map(([id,name,color])=>`<button class="material" data-material="${id}" aria-label="${name}" aria-pressed="${selection.material===id}">${sample(id,color)}</button>`).join('')}</div><div class="row">${icon('random','row-icon')}<div class="shapes">${['circle','square','triangle','hexagon'].map(id=>`<button class="shape" data-shape="${id}" aria-label="${labels[id]}" aria-pressed="${selection.shape===id}">${icon(id)}</button>`).join('')}</div></div><div class="row">${icon('size','row-icon')}<input id="size" aria-label="物体大小" type="range" min="25" max="180" value="${selection.size}"></div><div class="row">${icon('count','row-icon')}<input id="count" aria-label="物体数量" type="range" min="1" max="30" value="${selection.count}"><div id="quantity-dots" class="quantity-dots" aria-hidden="true">${Array.from({length:30},(_,i)=>`<i class="${i<selection.count?'on':''}"></i>`).join('')}</div></div><button class="submit" id="spawn" aria-label="放入物体">${icon('spawn')}</button>`,'添加物体');
 document.querySelectorAll('[data-material]').forEach(b=>b.onclick=()=>{selection.material=b.dataset.material;document.querySelectorAll('[data-material]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
 document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{selection.shape=b.dataset.shape;document.querySelectorAll('[data-shape]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
 $('size').oninput=()=>selection.size=+$('size').value;$('count').oninput=()=>{selection.count=+$('count').value;[...$('quantity-dots').children].forEach((d,i)=>d.classList.toggle('on',i<selection.count));};
 $('spawn').onclick=()=>{game.audio.init();game.queueSpawn(selection);close();};
};
function sceneArt(id){
 const arts={welcome:'<path d="m34 39 17-14 18 14" fill="#beb1e3"/><path d="M37 39h28v29H37Z" fill="#edc0b0"/><path d="M47 50h10v18H47Z" fill="#f5fbff"/><circle cx="19" cy="53" r="12" fill="#8fdbcb"/><circle cx="78" cy="60" r="8" fill="#a5cceb"/>',jelly:'<path d="M22 56c-5-25 14-35 31-31 23-4 34 24 21 38-11 14-46 13-52-7Z" fill="#efb1d2"/><ellipse cx="39" cy="37" rx="11" ry="4" fill="#fff9" transform="rotate(-20 39 37)"/><circle cx="62" cy="57" r="3" fill="#fff5"/>',balls:'<circle cx="29" cy="51" r="16" fill="#a7dacc"/><circle cx="60" cy="31" r="13" fill="#c7b9e8"/><circle cx="65" cy="61" r="12" fill="#9acded"/><circle cx="29" cy="28" r="7" fill="#f3d59b"/>',castle:'<path d="M21 30h9v8h9v-8h10v8h10v-8h10v8h9v30H21Z" fill="#abd5e5"/><path d="M41 68V52a9 9 0 0 1 18 0v16" fill="#f9fcff"/><path d="M26 44h8v9h-8m33-9h8v9h-8" fill="#fff8"/>',glass:'<path d="m20 23 24 2 7 26-21 14L12 45Z" fill="#8edce3"/><path d="m57 35 24-6 7 29-19 14-20-15Z" fill="#b3cdf2"/><path d="m23 25 9 16 15-13m-15 13-3 20m32-24 8 16 14-17" stroke="#fff9" stroke-width="2" fill="none"/>',clay:'<path d="M18 57c-5-11 0-16 9-17 3-17 18-20 27-9 20-3 29 11 19 22 4 15-11 19-25 15-14 8-27 0-30-11Z" fill="#beafe2"/><path d="M29 49q22-7 34-2m-30 11q13-5 24-3" stroke="#fff6" fill="none" stroke-width="2"/>'};
 return `<svg viewBox="0 0 100 90" aria-hidden="true"><ellipse cx="50" cy="72" rx="35" ry="3" fill="#b6d7e327"/>${arts[id]}</svg>`;
}
$('presets').onclick=()=>{const scenes=[['welcome','小镇'],['jelly','软糖'],['balls','彩球'],['castle','积木'],['glass','玻璃'],['clay','塑形']];open('scene',`<div class="presets">${scenes.map(([id,name])=>`<button class="preset" data-preset="${id}" aria-label="${name}">${sceneArt(id)}</button>`).join('')}</div>`,'场景');document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{game.loadPreset(b.dataset.preset);close();});};
const feedback=document.createElement('div');feedback.id='feedback';feedback.setAttribute('aria-hidden','true');document.body.append(feedback);
function popAt(x,y,color='#6acbd5'){
 const root=document.createElement('span');root.className='ui-pop';root.style.cssText=`left:${x}px;top:${y}px;--burst:${color}`;
 const ring=document.createElement('i');ring.className='ui-wave';root.append(ring);
 if(!platform.profile.settings.reducedMotion)for(let i=0;i<8;i++){const s=document.createElement('i'),a=i*Math.PI/4,travel=24+(i%3)*9;s.className=i%2?'ui-dot':'ui-star';s.style.cssText=`--x:${Math.cos(a)*travel}px;--y:${Math.sin(a)*travel}px;--turn:${i*67}deg;background:${['#75cbdc','#eab2d3','#f5d295','#8ed9c9'][i%4]};animation-delay:${i%2*15}ms`;root.append(s);}
 feedback.append(root);setTimeout(()=>root.remove(),650);
}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;popAt(e.clientX,e.clientY,getComputedStyle(b).getPropertyValue('--tone').trim()||'#75cbdc');b.classList.remove('button-flash');void b.offsetWidth;b.classList.add('button-flash');setTimeout(()=>b.classList.remove('button-flash'),330);game.audio.init();game.audio.tone(580,880,.045,.04,'sine');},{passive:true});
document.addEventListener('click',e=>{if(e.detail===0){const b=e.target.closest('button');if(b&&!b.disabled){const r=b.getBoundingClientRect();popAt(r.x+r.width/2,r.y+r.height/2);}}});
game.canvas.addEventListener('pointerdown',e=>{if(game.paused)return;const r=game.canvas.getBoundingClientRect(),p={x:e.clientX-r.x,y:e.clientY-r.y};game.fx.ring(p.x,p.y,'#70C7DB',34);game.fx.ring(p.x,p.y,'#FFFFFF',19);game.fx.burst(p.x,p.y,'#A5DFE7','spark',6,.3);});
const eggArt={
cloud:'<path d="M13 34C2 32 4 17 16 19 16 6 34 5 38 18c13-5 20 11 10 16Z" fill="#E8FAFE" stroke="#A5CFDC"/><path d="M22 26v2m13-2v2m-10 5q4 3 7-1" stroke="#85B3C4"/><path class="rain" d="m20 41-2 5m12-5-2 5m12-5-2 5" stroke="#9AC8E0" stroke-width="2"/>',
planet:'<circle cx="30" cy="28" r="17" fill="#D6C8EF" stroke="#B3A2D1"/><path d="M18 17q15-8 25 8" stroke="#FFF6" stroke-width="3"/><ellipse cx="30" cy="30" rx="28" ry="8" transform="rotate(-25 30 30)" stroke="#E3CBA5" stroke-width="3.5"/><ellipse cx="30" cy="30" rx="28" ry="8" transform="rotate(-25 30 30)" stroke="#FFEDD3" stroke-width="1"/><circle cx="7" cy="12" r="2" fill="#D4C6EF"/>',
sprout:'<path d="M29 43V23" stroke="#92BDB0" stroke-width="2"/><path d="M28 35Q8 37 11 23q16-3 17 12m3-4q20 1 17-17-16 0-17 17" fill="#C6E7D8" stroke="#A2CDB7"/><path d="M14 42h31l-4 13H18Z" fill="#D9E5F4" stroke="#B2C8E0"/><g class="bloom" fill="#EBC6DC" stroke="#D4AFCA"><circle cx="29" cy="14" r="9"/><circle cx="22" cy="21" r="8"/><circle cx="36" cy="21" r="8"/><circle cx="29" cy="26" r="8"/><circle cx="29" cy="21" r="5" fill="#F4DEB0"/></g>',
ufo:'<path class="beam" d="m20 35-9 21h39L39 35Z" fill="#ADE9DF55"/><path d="M19 25q0-17 11-17t12 17" fill="#C8F1EF" stroke="#A1CFD4"/><path d="M8 28q22-14 45 0-4 11-24 11T8 28Z" fill="#D5CEE9" stroke="#B1A7CC"/><ellipse cx="30" cy="29" rx="22" ry="5" fill="#EFE9F8" stroke="#C5B9D9"/><g fill="#A1D5CE"><circle cx="17" cy="32" r="2"/><circle cx="29" cy="34" r="2"/><circle cx="42" cy="32" r="2"/></g><path d="M26 19v2m8-2v2" stroke="#82ADAF"/>',
jar:'<path d="M17 12h27v4H17Z" fill="#D2D9EB" stroke="#B4C1D5"/><path d="M19 16v6q-9 5-9 13v13q0 7 8 7h25q7 0 7-7V35q0-9-8-13v-6Z" fill="#EAF9FFB3" stroke="#AECEDC"/><g stroke="none"><circle cx="23" cy="44" r="6" fill="#E4B6CE"/><circle cx="36" cy="46" r="7" fill="#B8D9D1"/><circle cx="30" cy="34" r="5" fill="#C3B9E3"/><circle cx="43" cy="36" r="4" fill="#EDD49F"/></g><path d="M15 34v13" stroke="#FFF" stroke-width="2.5"/>',
mushroom:'<path d="M25 29 22 51q8 9 17 0l-3-22Z" fill="#FFF0DF" stroke="#E5D2B9"/><path d="M9 30q2-24 21-24 20 0 24 24-24 10-45 0Z" fill="#E9BBD1" stroke="#CC9DBB"/><g fill="#FFF1F5" stroke="none"><ellipse cx="21" cy="18" rx="4" ry="3"/><circle cx="37" cy="15" r="3.5"/><ellipse cx="45" cy="26" rx="3" ry="2"/></g><path d="M27 44v2m8-2v2m-7 4q3 2 5 0" stroke="#B79B97"/>'
};
const eggLabels={cloud:'云朵彩蛋',planet:'星球彩蛋',sprout:'盆栽彩蛋',ufo:'飞碟彩蛋',jar:'玻璃瓶彩蛋',mushroom:'蘑菇彩蛋'};
const ornaments=document.createElement('aside');ornaments.className='ornaments';ornaments.setAttribute('aria-label','互动装饰');ornaments.innerHTML=Object.keys(eggArt).map(id=>`<button class="egg egg-${id}" data-egg="${id}" aria-label="${eggLabels[id]}"><svg viewBox="0 0 62 62" fill="none" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${eggArt[id]}</svg></button>`).join('');document.querySelector('.shell').prepend(ornaments);document.querySelectorAll('.doodle').forEach(el=>el.remove());
let lastEgg=-10;
ornaments.addEventListener('click',e=>{
 const b=e.target.closest('[data-egg]');if(!b||game.paused)return;const now=performance.now();if(now-lastEgg<400)return;lastEgg=now;game.waitingForInput=false;game.audio.init();b.classList.remove('egg-pop');void b.offsetWidth;b.classList.add('egg-pop');b.classList.toggle('awaken');setTimeout(()=>b.classList.remove('egg-pop'),750);
 const type=b.dataset.egg,x=game.W*(.3+Math.random()*.4),y=Math.min(game.H*.3,140);
 if(type==='cloud')for(let i=0;i<10;i++)game.spawnQueue.push({material:i%3?'glass':'rubber',shape:'circle',size:18+Math.random()*10,x:game.W*(.16+Math.random()*.68),y:32+Math.random()*25});
 if(type==='planet')for(let i=0;i<8;i++){game.makeRoom('rubber');const a=i*Math.PI/4,q=game.spawn('rubber',game.W/2+Math.cos(a)*70,game.H*.35+Math.sin(a)*70,20,'circle',{color:BOOP.config.palette[i%6]});if(q){q.body.vx=-Math.sin(a)*180;q.body.vy=Math.cos(a)*180;}}
 if(type==='sprout'||type==='ufo'){const kit=type==='sprout'?'flower':'rocket';game.makeRoom(kit);game.buildToy(kit,x,Math.max(80,y),90);}
 if(type==='jar')for(let i=0;i<6;i++)game.spawnQueue.push({material:'superball',shape:'circle',size:20+Math.random()*14,x:game.W*(.2+Math.random()*.6),y:40+Math.random()*45});
 if(type==='mushroom'){game.makeRoom('jelly');const q=game.spawn('jelly',x,Math.max(75,y),Math.min(game.W*.4,125),'circle',{color:'#E9B7D1'});if(q)for(const v of game.bodies(q))v.vy=-120;}
 game.audio.tone(420,760,.1,.08,'sine');game.fx.ring(x,y,'#B4DDE5',70);game.fx.burst(x,y,'#C9E4E2','spark',12,.45);
});

Object.defineProperty(window,'sandboxGame',{value:game});
})();

</script>
