name: Publish v1.1.0

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.1.0.yml]

permissions:
  contents: write

concurrency:
  group: publish-v1.1.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Validate, package and publish
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const vm=require('node:vm');
          const crypto=require('node:crypto');
          const {spawnSync}=require('node:child_process');
          (async()=>{
            const repo=process.env.REPO,commit=process.env.COMMIT,tag='v1.1.0';
            assert.equal(repo,'cabal312512/puchiworkshop');
            const base=`https://api.github.com/repos/${repo}`;
            const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10','User-Agent':'puchiworkshop-release'};
            async function api(path,method='GET',data){
              const response=await fetch(path.startsWith('https://')?path:base+path,{method,headers:{...headers,...(data?{'Content-Type':'application/json'}:{})},body:data?JSON.stringify(data):undefined});
              if(response.status===404&&method==='GET')return null;
              if(!response.ok)throw Error(`${method} ${path}: ${response.status} ${await response.text()}`);
              return response.status===204?null:response.json();
            }
            const names=['index.html','LICENSE','README.md','screenshots/workshop.jpg','screenshots/castle.jpg','screenshots/space.jpg'],files={};
            for(const name of names){const object=await api(`/contents/${name}?ref=${commit}`);assert(object&&object.encoding==='base64',`Missing ${name}`);files[name]=Buffer.from(object.content,'base64');assert.equal(files[name].length,object.size);}
            const source=files['index.html'].toString('utf8');let scripts=0;
            for(const [,code]of source.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)){new vm.Script(code);scripts++;}
            assert(scripts>=8);assert(source.includes('G.rayHitsSpecial'));assert(source.includes('G.buildCastle'));assert(source.includes('G.buildCarnival'));assert(source.includes("if(e.abduction)mood='surprise'"));
            assert(files.LICENSE.toString('utf8').startsWith('MIT License\n'));assert(files.LICENSE.toString('utf8').includes('Copyright (c) 2026 cabal312512'));
            const readme=files['README.md'].toString('utf8');assert.equal((readme.match(/。/g)||[]).length,2);
            function dimensions(bytes){assert.equal(bytes.readUInt16BE(0),0xffd8);let i=2;while(i<bytes.length){assert.equal(bytes[i],0xff);while(bytes[i]===0xff)i++;const marker=bytes[i++];if(marker===0xd9||marker===0xda)break;const size=bytes.readUInt16BE(i);if([0xc0,0xc1,0xc2].includes(marker))return[bytes.readUInt16BE(i+5),bytes.readUInt16BE(i+3)];i+=size;}throw Error('JPEG size missing');}
            for(const name of names.filter(n=>n.endsWith('.jpg'))){assert.deepEqual(dimensions(files[name]),[1440,1000]);assert(readme.includes(name));}
            fs.mkdirSync('release-files');fs.writeFileSync('release-files/index.html',files['index.html']);fs.writeFileSync('release-files/LICENSE',files.LICENSE);
            const zipName=`puchiworkshop-${tag}.zip`;
            const packaged=spawnSync('python3',['-c',"import zipfile\nwith zipfile.ZipFile('release-files/"+zipName+"','w',zipfile.ZIP_DEFLATED) as z:\n z.write('release-files/index.html','index.html')\n z.write('release-files/LICENSE','LICENSE')"]);
            assert.equal(packaged.status,0,packaged.stderr.toString());
            const assets=[['index.html','text/html; charset=utf-8'],['LICENSE','text/plain; charset=utf-8'],[zipName,'application/zip']].map(([name,type])=>{const bytes=fs.readFileSync('release-files/'+name);return{name,type,bytes,digest:'sha256:'+crypto.createHash('sha256').update(bytes).digest('hex')};});
            const body='新增巨型软糖、乱飞彩球、精细城堡、星环捕猎场和可拆摩天轮游乐园，优化行星表情、引力、飞碟捕猎、激光伤害和运行性能。\n\n下载 ZIP 后解压，用浏览器打开 index.html 即可游玩，支持电脑和手机。\n\nMIT License · Copyright (c) 2026 cabal312512\n\n'+assets.map(a=>`SHA-256 (${a.name}): \`${a.digest.slice(7)}\``).join('\n\n');
            let release=await api(`/releases/tags/${tag}`);
            if(release){assert.equal(release.target_commitish,commit,'Existing version belongs to another commit');if(!release.draft){for(const asset of assets){const found=release.assets.find(a=>a.name===asset.name);assert(found&&found.size===asset.bytes.length&&found.digest===asset.digest);}console.log(release.html_url);return;}}
            else release=await api('/releases','POST',{tag_name:tag,target_commitish:commit,name:'v1.1.0',body,draft:true,prerelease:false});
            for(const asset of assets){
              const existing=(await api(`/releases/${release.id}/assets`)).find(a=>a.name===asset.name);
              if(existing&&existing.digest===asset.digest&&existing.size===asset.bytes.length)continue;
              if(existing)await api(`/releases/assets/${existing.id}`,'DELETE');
              const upload=release.upload_url.replace(/\{.*$/,'')+'?name='+encodeURIComponent(asset.name);
              const response=await fetch(upload,{method:'POST',headers:{...headers,'Content-Type':asset.type},body:asset.bytes});
              if(!response.ok)throw Error(`Upload ${asset.name}: ${response.status} ${await response.text()}`);
              const uploaded=await response.json();assert.equal(uploaded.size,asset.bytes.length);
            }
            const uploaded=await api(`/releases/${release.id}/assets`);assert.equal(uploaded.length,assets.length);
            for(const asset of assets){const remote=uploaded.find(a=>a.name===asset.name);assert(remote&&remote.state==='uploaded'&&remote.size===asset.bytes.length);assert.equal(remote.digest,asset.digest,`Checksum mismatch: ${asset.name}`);}
            const ref=await api(`/git/ref/tags/${tag}`);if(ref)assert.equal(ref.object.sha,commit);
            release=await api(`/releases/${release.id}`,'PATCH',{draft:false,body,make_latest:'true'});assert.equal(release.draft,false);
            const publishedRef=await api(`/git/ref/tags/${tag}`);assert.equal(publishedRef.object.sha,commit);
            console.log(`Published ${release.html_url}`);for(const asset of assets)console.log(`${asset.name}: ${asset.digest}`);
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
